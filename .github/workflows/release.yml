name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binaries & macOS App
        run: |
          mkdir -p dist
          
          # Build Darwin ARM64 (Apple Silicon M1/M2/M3/M4)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/macos-advance-ip-scanner-darwin-arm64 main.go
          
          # Build Darwin AMD64 (Intel Mac)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/macos-advance-ip-scanner-darwin-amd64 main.go
          
          # Package CLI archives
          cd dist
          tar -czvf macos-advance-ip-scanner-darwin-arm64.tar.gz macos-advance-ip-scanner-darwin-arm64
          tar -czvf macos-advance-ip-scanner-darwin-amd64.tar.gz macos-advance-ip-scanner-darwin-amd64
          cd ..
          
          # Create Universal macOS .app bundle
          APP_DIR="dist/Advanced IP Scanner.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp scripts/Info.plist "${APP_DIR}/Contents/Info.plist"
          
          # Create universal binary using lipo
          lipo -create -output "${APP_DIR}/Contents/MacOS/macos-advance-ip-scanner" \
            dist/macos-advance-ip-scanner-darwin-arm64 \
            dist/macos-advance-ip-scanner-darwin-amd64
          chmod +x "${APP_DIR}/Contents/MacOS/macos-advance-ip-scanner"
          
          # Zip .app bundle
          cd dist
          zip -r "Advanced-IP-Scanner-macOS-Universal.zip" "Advanced IP Scanner.app"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/macos-advance-ip-scanner-darwin-arm64.tar.gz
            dist/macos-advance-ip-scanner-darwin-amd64.tar.gz
            dist/Advanced-IP-Scanner-macOS-Universal.zip
